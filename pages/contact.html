<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | SpireX Foundation</title>
    
    <link rel="stylesheet" href="../css/contact.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Contact Page -->
    <main class="contact-page">

        <!-- Heading -->
        <section class="contact-heading">

            <span class="contact-tag">
                <span>●</span> Get In Touch
            </span>

            <h1>Contact Us</h1>

            <div class="heading-line"></div>

            <p>
                lets build something great together! Get in touch with us.
            </p>

        </section>


        <!-- Contact Area -->
        <section class="contact-container">

            <!-- LEFT SIDE -->
            <div class="contact-details">

                <div class="detail-item">
                    <div class="detail-icon">●</div>

                    <div>
                        <h3>Location</h3>
                        <p>Tamilnadu, India</p>
                    </div>
                </div>


                <div class="detail-item">
                    <div class="detail-icon">✉</div>

                    <div>
                        <h3>Email</h3>
                        <p>spirexfoundation@gmail.com</p>
                    </div>
                </div>



                <div class="follow-section">

                    <h3>Follow Us</h3>

                    <div class="social-icons">


                        <a href="https://www.linkedin.com/company/spirex-foundation/" class="linkedin">in</a>
                       <a href="https://www.instagram.com/spirexfoundation" class="instagram" aria-label="Instagram">
    <span class="instagram-icon">
        <span class="instagram-circle"></span>
        <span class="instagram-dot"></span>
    </span>
</a>
                        <a href="https://mail.google.com/mail/?view=cm&fs=1&to=contact.spirexfoundation@gmail.com" class="mail">✉</a>

                    </div>

                </div>

            </div>


            <!-- RIGHT SIDE -->
            <form class="contact-form">

                <div class="input-row">

                    <input
                        type="text"
                        placeholder="Your Name"
                        required
                    >

                    <input
                        type="email"
                        placeholder="Your Email"
                        required
                    >

                </div>

                <input
                    type="text"
                    placeholder="Subject"
                    required
                >

                <textarea
                    placeholder="Your Message"
                    required
                ></textarea>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <div id="footer-container"></div>


    <script src="../js/includes.js"></script>
    <script src="../js/main.js"></script>

</body>
</html>
